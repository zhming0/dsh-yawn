# The sandbox pool for one control plane: the SandboxTemplate and SandboxWarmPool
# that the Kubernetes backend claims sessions from. Apply it after the control
# plane (the Helm chart), which owns the namespace, the control plane's identity
# and permissions, and the `dsh-yawn-runner-config` ConfigMap. The control plane
# also creates the `dsh-yawn-registration-token` Secret the template mounts, so
# sandboxes can only start once it is running.
#
# The pool has to land in the control plane's namespace, and this base refuses
# to guess it. The name below is a placeholder no cluster has, so applying the
# base without an overlay fails instead of putting warm pods where the control
# plane cannot claim them. Name the release namespace in an overlay, which is also
# where an operator repository references the base and varies it:
#
#   namespace: dsh-yawn
#   resources:
#     - https://github.com/zhming0/dsh-yawn//deploy/kubernetes/runner?ref=<release-tag>
#
#   images:
#     - name: ghcr.io/zhming0/dsh-yawn-runner
#       newTag: <release-tag>
#
#   patches:
#     - target: { kind: SandboxWarmPool, name: dsh-yawn-universal }
#       patch: |-
#         - op: replace
#           path: /spec/replicas
#           value: 4
#
# That one namespace also covers the tunnel egress rule, which selects the
# control-plane pod in the pool's own namespace. Vary storage or pod resources
# with a whole-list or map patch, never a list index:
# docs/installations-kas.md#configure-the-pool has the recipes.
#
# The base names the runner image without a tag: the image is the same artifact
# for every release, and which version a cluster runs belongs to whoever
# installed the control plane. The overlay pins it, and the chart's appVersion
# is the version to match — the control plane's default runner tag is built from
# it, and a warm pod of another version cannot register with it.
#
# Because it is static — no release name, no image tag — the resource names are
# fixed, and only the overlay's `images:` entry varies between releases. One
# control plane per namespace is what makes that work.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dsh-set-your-namespace

resources:
  - 20-sandbox-template.yaml
  - 30-warm-pool.yaml
