apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: dsh-yawn-universal
spec:
  # Runners dial the control-plane tunnel, so a per-sandbox Service is
  # unnecessary and no ingress is allowed at all.
  service: false
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  networkPolicyManagement: Managed
  networkPolicy:
    ingress: []
    egress:
      # The runner-initiated WebSocket tunnel to the control plane; all RPCs
      # flow over it. A peer with a podSelector and no namespaceSelector means
      # the NetworkPolicy's own namespace, which is the namespace the overlay
      # puts the pool in — the control plane's. Naming the namespace here would
      # not follow the overlay's `namespace:` and would need a patch in every
      # install that is not in `dsh-yawn`.
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: dsh-yawn-control-plane
        ports:
          - protocol: TCP
            port: 8081
      # DNS is the only cluster service this reference policy explicitly permits.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      # HTTP and HTTPS are needed for source/package downloads and for services
      # that only speak plain HTTP. This also permits private and cluster IPs on
      # 80 and 443; replace it with organization CIDRs/FQDN-aware CNI policy in
      # production. All other egress is denied.
      - ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 443
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # The checkout, the home directory (mise toolchains and package
            # caches), the artifacts folder, and the apt cache, which holds up
            # to 2GiB of .deb files; see docs/kubernetes.md.
            storage: 6Gi
  podTemplate:
    metadata:
      annotations:
        # `kubectl logs` and `kubectl exec` without `-c` pick the runner.
        kubectl.kubernetes.io/default-container: runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/zhming0/dsh-yawn-runner
          imagePullPolicy: IfNotPresent
          env:
            # The Docker CLI in the runner talks to the rootless daemon in the
            # `docker` sidecar over this socket. The runner forwards this
            # variable to every command it runs.
            - name: DOCKER_HOST
              value: unix:///run/user/1000/docker.sock
            # agent-sandbox names the backing pod after its Sandbox, so this
            # downward-API value is the assigned Sandbox name the control plane
            # expects in the tunnel handshake and in Health responses.
            - name: DSH_YAWN_SANDBOX_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The control plane writes both: DSH_YAWN_CONTROL_PLANE_URL in the dsh-yawn-runner-config
            # ConfigMap, the shared token in the dsh-yawn-registration-token Secret
            # under the key `token`. Naming each key explicitly is what keeps
            # this manifest free of install-specific values; the names and
            # keys are the fixed contract, so there is nothing to fill in.
            - name: DSH_YAWN_CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: dsh-yawn-runner-config
                  key: DSH_YAWN_CONTROL_PLANE_URL
            - name: DSH_YAWN_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsh-yawn-registration-token
                  key: token
          ports:
            # The plain health listener; only the kubelet probe uses it.
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          securityContext:
            # The image gives the sandbox user passwordless sudo so a repository
            # setup hook can install the system packages its mise.toml declares.
            # The setuid transition only happens with no_new_privs off, which is
            # what this flag controls; it is the deliberate exception to the
            # hardened profile. Seccomp stays RuntimeDefault, the pod still runs
            # as UID 1000 with no host mounts, and the capabilities below stay
            # narrow.
            allowPrivilegeEscalation: true
            capabilities:
              drop: [ALL]
              # The subset of the runtime's default set that apt, dpkg, and
              # sudo use. The network, kill, and chroot capabilities stay out,
              # and SYS_ADMIN above all, so the session still cannot mount a
              # filesystem or rearrange its own root.
              add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, MKNOD, SETFCAP, SETGID, SETPCAP, SETUID]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-socket
              mountPath: /run/user/1000
        # Rootless Docker daemon for the session. It runs as UID 1000 via
        # rootlesskit, so nested containers never hold root on the node, and
        # everything it starts shares this pod's network namespace and
        # NetworkPolicy. The container is nevertheless `privileged`: that is the
        # only Kubernetes switch that removes the seccomp profile, AppArmor,
        # and the masked /proc paths that rootlesskit and its nested runc need.
        # The non-privileged alternative, `procMount: Unmasked`, requires pod
        # user namespaces (`hostUsers: false`), which not every cluster offers.
        # Note that privileged mode disables the RuntimeDefault seccomp
        # profile for this container only; the runner keeps it.
        - name: docker
          image: docker:29.8.0-dind-rootless
          imagePullPolicy: IfNotPresent
          # Naming `dockerd` explicitly skips the entrypoint's defaults, which
          # would also listen on TCP 2375/2376 inside the pod.
          args:
            - dockerd
            - --host=unix:///run/user/1000/docker.sock
          env:
            - name: DOCKER_HOST
              value: unix:///run/user/1000/docker.sock
          readinessProbe:
            exec:
              command: [docker, version, --format, '{{.Server.Version}}']
            initialDelaySeconds: 2
            periodSeconds: 3
          securityContext:
            privileged: true
          volumeMounts:
            # Same path as in the runner, so `docker run -v /workspace/...`
            # bind-mounts the session's files.
            - name: workspace
              mountPath: /workspace
            - name: docker-socket
              mountPath: /run/user/1000
            # Images and containers, under the daemon's default data root
            # `~/.local/share/docker`. Deliberately not on the workspace
            # volume: they would count against its quota, and fsGroup
            # ownership fixes at every wake would rewrite the group of every
            # image layer file. Hibernation therefore keeps the workspace, not
            # pulled images. The mount is one level above the data root
            # because a mount point belongs to real root, whom the daemon's
            # user namespace does not map; the daemon must create and own the
            # `docker` directory itself.
            - name: docker-data
              mountPath: /home/rootless/.local/share
      volumes:
        - name: docker-socket
          emptyDir:
            medium: Memory
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
