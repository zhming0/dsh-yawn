apiVersion: v2
name: dsh-yawn
description: >-
  The dsh-yawn control plane: one dsh host, its data volume, and the tunnel
  Service runners dial. The sandbox infrastructure is a separate kustomize
  base (deploy/kubernetes/runner).
type: application
# Both fields are stamped with the release version by
# .buildkite/steps/package-and-push-chart, which publishes the chart. The stamp
# lives in the build checkout only, so the checked-in values are the last
# version a human set and can lag the published chart.
# appVersion is also the default `controlPlane.image.tag` and the version an
# operator matches when pinning the sandbox pool's runner image.
version: 0.1.0
appVersion: "2026.9.5-1151143"
home: https://github.com/zhming0/dsh-yawn
sources:
  - https://github.com/zhming0/dsh-yawn
keywords:
  - dsh
  - kubernetes
  - ai
