syntax = "proto3";

package dsh.yawn.v1;

option go_package = "github.com/zhming0/dsh-yawn/runner/gen/dsh/yawn/v1;yawnv1";

service RunnerService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc SandboxStatus(SandboxStatusRequest) returns (SandboxStatusResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc ResolveExecutable(ResolveExecutableRequest) returns (ResolveExecutableResponse);
  rpc ResolvePath(ResolvePathRequest) returns (ResolvePathResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc ReadFileRange(ReadFileRangeRequest) returns (ReadFileRangeResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc EditFile(EditFileRequest) returns (EditFileResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc SetSecrets(SetSecretsRequest) returns (SetSecretsResponse);
  rpc SetGitCredentials(SetGitCredentialsRequest) returns (SetGitCredentialsResponse);
  rpc Setup(SetupRequest) returns (SetupResponse);
  // One browser request relayed to a server inside the sandbox. Each side
  // sends its head message first, then body chunks; see the message docs.
  rpc HttpProxy(stream HttpProxyRequest) returns (stream HttpProxyResponse);
}

message HealthRequest {}

message HealthResponse {
  string sandbox_id = 1;
  bool setup_complete = 2;
}

message SandboxStatusRequest {}

// What the sandbox machine reports about itself for the session's Sandbox tab.
// Everything here is a fact only the machine can answer; the host contributes
// the sandbox lifecycle facts it owns around this response.
message SandboxStatusResponse {
  string sandbox_id = 1;
  string hostname = 2;
  string os_name = 3;
  string kernel_version = 4;
  string architecture = 5;
  int32 cpu_count = 6;
  // Total memory the sandbox may use: the cgroup limit when one is set, the
  // machine's total otherwise.
  int64 memory_total_bytes = 7;
  // The repository checkout. Split out from the filesystem below because on
  // Kubernetes this is the volume that survives a wake, so it answers "will my
  // work still fit" rather than "how full is the container".
  int64 workspace_disk_used_bytes = 8;
  int64 workspace_disk_total_bytes = 9;
  int64 filesystem_disk_used_bytes = 10;
  int64 filesystem_disk_total_bytes = 11;
  // Seconds since the runner process started, which is when the sandbox began
  // serving this session.
  int64 uptime_seconds = 12;
  // TCP ports with a listening socket in the sandbox's network namespace,
  // ascending. The runner's own health listener is not one of them. A server
  // the session started shows up here, which is how a preview finds its port
  // without anyone being told it.
  repeated int32 listening_ports = 13;
}

message ExecRequest {
  repeated string argv = 1;
  string cwd = 2;
  map<string, string> env = 3;
  bytes stdin = 4;
}

message ExecResponse {
  oneof event {
    ExecStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    ExecExited exited = 4;
  }
}

message ExecStarted {
  int64 pid = 1;
}

message ExecExited {
  int32 exit_code = 1;
  string signal = 2;
}

message ResolveExecutableRequest {
  string command = 1;
  map<string, string> env = 2;
}

message ResolveExecutableResponse {
  string path = 1;
}

message ResolvePathRequest {
  string path = 1;
  string cwd = 2;
}

message ResolvePathResponse {
  string canonical_path = 1;
  string display_path = 2;
}

message ReadFileRequest {
  string path = 1;
  int64 max_bytes = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

// One byte window of a regular file. Unlike ReadFile, a file larger than the
// window is not an error: the runner reads at most `length` bytes starting at
// `offset`, fewer when the file ends inside the window and none at or past its
// end.
message ReadFileRangeRequest {
  string path = 1;
  int64 offset = 2;
  int64 length = 3;
}

message ReadFileRangeResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  oneof guard {
    bool create_if_absent = 3;
    string expected_version = 4;
  }
}

message WriteFileResponse {
  bool created = 1;
  bool had_before = 2;
  bytes before = 3;
  string version = 4;
}

message EditFileRequest {
  string path = 1;
  string old_string = 2;
  string new_string = 3;
  bool replace_all = 4;
  string expected_version = 5;
}

message EditFileResponse {
  bytes before = 1;
  bytes after = 2;
  string version = 3;
}

message StatRequest {
  string path = 1;
  bool follow_symlinks = 2;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message StatResponse {
  bool exists = 1;
  FileType type = 2;
  int64 size = 3;
  string version = 4;
}

message ListRequest {
  string path = 1;
}

message ListEntry {
  string name = 1;
  string canonical_path = 2;
  FileType type = 3;
  int64 size = 4;
  string version = 5;
}

message ListResponse {
  repeated ListEntry entries = 1;
}

// Recursive workspace listing for host-side file-reference discovery ("@"
// completion). The runner owns the walk so the host never needs the tree.
message TreeRequest {
  // Absolute root directory to walk. Entries are returned relative to it.
  string path = 1;
  // Directory basenames never traversed or offered (e.g. "node_modules").
  repeated string excluded_directories = 2;
  // Cap on returned entries; walk stops once it is reached.
  int64 max_entries = 3;
}

message TreeEntry {
  // Path relative to the requested root, forward-slash separated.
  string relative_path = 1;
  FileType type = 2;
}

message TreeResponse {
  repeated TreeEntry entries = 1;
  // True when traversal stopped at max_entries before covering the tree.
  bool truncated = 2;
}

message SetSecretsRequest {
  map<string, string> secrets = 1;
}

message SetSecretsResponse {}

message GitCredential {
  string host = 1;
  string username = 2;
  string password = 3;
}

message SetGitCredentialsRequest {
  repeated GitCredential credentials = 1;
}

message SetGitCredentialsResponse {}

message SetupRequest {
  string repository_url = 1;
  string revision = 2;
  string workspace = 3;
}

message SetupResponse {
  bool ran = 1;
}

// One request the control plane relays from a browser to a server listening
// on the sandbox's loopback. The first message on the stream must be the
// head; every later message is body bytes. Headers are plain pairs so
// repeatable ones (Set-Cookie) survive; both sides strip hop-by-hop headers
// and the Host header, because the loopback address is the runner's business.
message HttpProxyRequest {
  oneof part {
    HttpProxyRequestHead head = 1;
    bytes body = 2;
  }
}

message HttpProxyRequestHead {
  string method = 1;
  // The request target as the browser sent it: path and query only. A
  // target without a leading slash is rejected.
  string target = 2;
  // The loopback port the sandbox server listens on.
  int32 port = 3;
  repeated HttpProxyHeader headers = 4;
}

message HttpProxyHeader {
  string name = 1;
  string value = 2;
}

message HttpProxyResponse {
  oneof part {
    HttpProxyResponseHead head = 1;
    bytes body = 2;
  }
}

message HttpProxyResponseHead {
  int32 status = 1;
  repeated HttpProxyHeader headers = 2;
}
