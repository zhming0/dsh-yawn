packages:
  - control-plane
  # The image's CLI tree is installed by the Dockerfile from its own lockfile,
  # so it must never join the workspace install.
  - '!control-plane/image/dsh-cli'

overrides:
  react-dom: 18.2.0
  # One cosmokit everywhere: schemastery's peer otherwise resolves its own
  # 1.8.4 copy, and the duplicate leaks into emitted declaration types.
  '@deepseek-ai/cosmokit': 1.8.5

allowBuilds:
  '@bufbuild/buf': true

# This repository pins each dsh release candidate as soon as it is published,
# which is inside pnpm's default 24-hour minimumReleaseAge window.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
