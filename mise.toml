# Single source of truth for tool versions, used by CI and local development.
# After cloning, run `mise install`.
#
# pnpm is deliberately absent. The root package.json `packageManager` field
# already pins it, and corepack, bundled with the Node below, reads that field.
min_version = "2025.11.0"

[tools]
# Node 24.19.0 is the newest release without the HTTP/2 regression in
# https://github.com/nodejs/node/issues/65677: 24.20.0 and 24.21.0 report
# ERR_STREAM_PREMATURE_CLOSE for buffered responses, and the control plane's
# Connect HTTP/2 tunnel is exposed to it. Move only to a release with the fix.
node = "24.19.0"
go = "1.26.7"
kind = "0.33.0"
kubectl = "1.37.0"

# Lints and packages deploy/helm/dsh-yawn. `kubectl kustomize` renders
# the sandbox pool with the kubectl pin above.
helm = "4.2.4"

# `buf generate` calls these two plugins as local binaries. Keep the versions
# equal to the matching modules in runner/go.mod, or generated code and the
# runtime it compiles against can drift. The third plugin, protoc-gen-es, comes
# from pnpm because it shares a version with @bufbuild/protobuf.
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.10"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.19.1"

# Only the release pipeline needs the GitHub CLI. The aqua registry entry for it
# fails attestation verification, so install it directly from GitHub instead.
"github:cli/cli" = "2.102.0"

# Contributors use the Buildkite CLI to inspect and manage CI builds.
"aqua:buildkite/cli" = "3.55.0"

# Lints the runner module. Prebuilt binary from the aqua registry, so CI steps
# do not spend minutes compiling it from source.
"aqua:golangci/golangci-lint" = "2.13.2"
