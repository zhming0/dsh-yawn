# Binds the Web UI to every interface so a published port can reach it; the
# entrypoint applies it when DSH_YAWN_BIND_ALL=1.
#
# dsh otherwise listens on 127.0.0.1, and the launcher rejects `--host 0.0.0.0`,
# so the webserver row is restated with a 0.0.0.0 fallback (an explicit --host
# still wins). A patch replaces a row's whole config, so the other fields are
# copied from the web bundle. Kubernetes leaves the flag off and keeps dsh on
# pod loopback behind oauth2-proxy.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
