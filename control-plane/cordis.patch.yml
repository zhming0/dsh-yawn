# The dsh-yawn bundle patch. `dsh plugin add` appends this package to the
# profile's bundle list, so this layer applies after dsh-base and after the
# surface bundle (dsh-web-app, dsh-headless).
#
# It swaps the three host capability rows and disables host-only helpers that
# cannot operate through the remote boundary. Tool rows stay wherever the
# surface bundle put them: in the host plane for headless, behind agent presets
# for web. That lets the stock agent compositions work unchanged.

# The host filesystem provider, so `read`, `write`, `edit`, and `present`
# address the session's sandbox workspace.
- id: fs-sandbox
  disabled: true

# The host shell executor, so `bash` runs in the sandbox.
- id: bash-sandbox
  disabled: true

# The host process spawner. The shell executor above is built on it, so this
# is the seam that actually moves execution off the dsh host.
- id: subprocess
  disabled: true

# Permission presets switch dsh's local shell sandbox modes. The remote shell
# runs in one fixed container boundary and does not claim to enforce those
# per-command modes, so dsh correctly refuses to compose the preset service.
- id: permission
  disabled: true

# The General-settings Permission row goes with the service. Since 0.1.7 the
# row reads a `permissionPresets` catalog Remote, and dsh-api-remotes mounts
# that Remote client whether or not its host plugin loaded, so the call answers
# HTTP 404 and the row renders the error instead of hiding. The row also
# carries the composer's permission picker, which needs the same catalog.
# Web-only, like directory-picker.
- id: ui-permission
  disabled: true

# DeepSeek account sign-in is not used: model access is API-key based, and a
# signed-in account would store one shared grant in this control plane's
# credential store. The provider, its model route, and the Web account UI and
# Remote controller go together.
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

# Web-only rows, like ui-permission. A headless profile skips them with a
# warning because dsh-web-app never mounts them.
- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

# dsh's sandbox policy describes the host's own file sandbox: a per-session
# mode switch, a host directory the agent may write under, and a line in every
# model request ("Current DSH file policy: workspace-write ... may modify files
# under the session workspace: <path>") that renders the session cwd. That cwd
# is the host anchor here and does not exist inside the sandbox, and the rows
# above turn off the boundary the line describes, so the stock row would
# mislead the model. The sandbox-workspace-policy row inserted below stands in
# for it: it answers the Web rows that read `workspaceRoot` with the sandbox
# workspace and adds nothing to the prompt.
- id: sandbox-policy
  disabled: true

# The PTC Node backend runs its bootstrap and its programs inside the sandbox, so
# both paths have to name the sandbox's own copies. Left alone the provider uses
# its own bootstrap — a control-plane path no sandbox has — and the control
# plane's `process.execPath`, which exists in a sandbox only by coincidence. The
# runner image ships the compatible bootstrap; a control-plane test keeps its
# version equal to the dsh pin (see runner/Dockerfile).
- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  config:
    launch:
      kind: node-script
      executable: node
      bootstrapPath: /opt/dsh-yawn/ptc-runtime-node/process.js

# dsh tells the model where the host's dsh checkout is and which URL serves
# the Web GUI, and adds guidance for editing dsh itself. None of it holds
# inside a sandbox: the checkout is not there and the URL is unreachable. The
# sandbox-context row inserted below keeps the one still-true sentence, that
# "this page" means the Web UI. Web-only, like directory-picker.
- id: harness-dev-context
  disabled: true

# The Web right sidebar's Files and Preview tabs, and the deliverables cards
# under each turn, read through `workspace-files`, which serves the browser
# from plain HTTP requests outside any agent turn. This package's filesystem
# finds a session's sandbox through the calling agent, so on its own the stock
# service fails on every request. The sandbox-workspace-files row inserted
# below wraps its methods on the live service and runs each one as the agent
# of the session named on the wire. The stock row stays mounted under its own
# name: the Web app serves a package's browser half only for a mounted row of
# that package, and the sidebar's file resource provider lives in that half.

# Replace the Web app's host-directory chooser with this package's repository
# URL flow. This patch is skipped with a warning in profiles, such as headless,
# where the Web-only row does not exist.
- id: directory-picker
  disabled: true

# The Web header's "Open in..." button launches a desktop application on the
# dsh host against the session cwd. Neither holds here: the host runs headless
# and the cwd is the bookkeeping anchor, while the application probe would run
# through the sandbox subprocess seam and report programs installed in the
# sandbox. Both halves go: the browser half calls the host routes directly, so
# it cannot stand without them. Web-only, like directory-picker.
- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

# The stock "@" file-discovery provider walks the session cwd on the host
# filesystem. That cwd is this package's bookkeeping anchor directory, which
# holds no repository content — the files live inside the sandbox — so the
# stock row can never see them. The sandbox-file-reference row below lists the
# sandbox workspace through the runner instead. Web-only, like directory-picker.
- id: file-reference-local
  disabled: true

# 0.1.7 mounts a Plugins page that installs, enables, and removes profile
# bundles from the Web UI. It stays on: the profile lives on the data volume,
# so dsh-yawn-seed carries what the page installs across image upgrades (see
# image/seed). Installed bundles run in the control-plane process, so the page
# is an operator surface gated by the Web UI's own authentication. The page
# also lists this bundle and can switch the control plane's own services off;
# re-enable it from the same page if that happens.

# The Web Terminal tab stays mounted: its host half (`terminal-controller`) and
# its browser half (`ui-sidebar-terminal`) go together, and the
# sandbox-terminal-controller row inserted below gives the host half the agent
# boundary its subprocess calls need. The stock rows are untouched, so the
# sidebar's terminal provider still ships with the page.

- insert:
    # Owns one sandbox per dsh session: provision, idle hibernate, wake, expiry,
    # and the credential broker. Every default works as-is against local Docker.
    - id: sandbox-manager
      name: '@zhming0/dsh-yawn'

    - id: sandbox-fs
      name: '@zhming0/dsh-yawn/fs'

    - id: sandbox-shell
      name: '@zhming0/dsh-yawn/shell'

    # The stock persistent bash tool caches its PTY id for the agent's whole
    # life. A wake on a new machine kills that PTY while the control plane
    # keeps the id, so the tool's first command after wake reports the shell
    # as exited instead of running. The tool resets the stale id on that path;
    # this wrapper retries the same dispatch once, which then starts a fresh
    # PTY. Clearing a terminal pool on wake cannot do this because the tool's
    # registry is its own.
    - id: persistent-bash-recovery
      name: '@zhming0/dsh-yawn/persistent-bash-recovery'

    - id: sandbox-subprocess
      name: '@zhming0/dsh-yawn/subprocess'

    - id: sandbox-file-reference
      name: '@zhming0/dsh-yawn/file-reference'

    # States the sandbox environment in the model's system prompt: shadows the
    # cwd prompt variable with the sandbox workspace and contributes a short
    # environment section.
    - id: sandbox-context
      name: '@zhming0/dsh-yawn/sandbox-context'

    # `ctx.sandboxPolicy` for the Web rows that read it: reports the sandbox
    # workspace as the root and adds no prompt line (see the stock row above).
    - id: sandbox-workspace-policy
      name: '@zhming0/dsh-yawn/sandbox-policy'

    # Keeps dsh's per-session working directory (the stock working-directory
    # row) in sandbox paths: the model's "Current working directory" line and
    # the `working_directory` tool name the sandbox workspace, not the host
    # anchor, and the service reaches the sandbox as the agent it serves.
    # Same wait-not-inject shape as the rows below.
    - id: sandbox-working-directory
      name: '@zhming0/dsh-yawn/working-directory'

    # Runs the Web Files and Preview sidebar (the stock workspace-files row
    # above) as the session it serves. Waits for the Web-only services instead
    # of injecting them, so a headless profile still boots with this row.
    - id: sandbox-workspace-files
      name: '@zhming0/dsh-yawn/workspace-files'

    # Runs the Web Terminal tab (the stock terminal-controller row above) as
    # the session it serves, so opening a terminal wakes and reaches the
    # session's sandbox, and terminal input keeps it awake. Same wait-not-
    # inject shape as the row above.
    - id: sandbox-terminal-controller
      name: '@zhming0/dsh-yawn/terminal-controller'

    # Runs dsh's /api/file media route (the chat's inline images) as the
    # session the image belongs to. The stock route reads through ctx.fs with
    # no agent turn and no session id in its URL; the bundle's browser half
    # adds the enclosing conversation's session to each image URL as a
    # query parameter, and this row turns it into the agent boundary the
    # sandbox filesystem needs. Same
    # wait-not-inject shape as the two rows above.
    - id: sandbox-media-route
      name: '@zhming0/dsh-yawn/media-route'

    # Skills authored in this package as TypeScript modules, for the reason the
    # stock skill rows cannot serve a sandbox: `dsh-skill-filesystem` reads its
    # user roots through the sandbox filesystem, so `$DSH_HOME/skills` on the
    # host is a path that does not exist in the pod. This row registers the
    # modules under `src/skills/` into the global layer of the skill registry,
    # which every agent's merged catalog carries. An empty folder registers
    # nothing, so the row is inert until a skill is authored.
    - id: skills
      name: '@zhming0/dsh-yawn/skills'

    # Keeps the Scratch Workspace (no repository; each session starts in an
    # empty sandbox) registered whenever the Web workspace registry comes up,
    # and refuses to delete it. Same wait-not-inject shape as the rows above.
    - id: sandbox-scratch-workspace
      name: '@zhming0/dsh-yawn/scratch-workspace'

    # Keeps fresh installations off dsh 0.1.7's automatic default Workspace,
    # which would land in a Documents folder the image does not have; the
    # Scratch Workspace registered by the row above takes its place.
    # The client treats the `undefined` answer as plain ineligibility — no
    # error. See src/workspace-first-use.ts.
    - id: workspace-first-use
      name: '@zhming0/dsh-yawn/workspace-first-use'

    # Serves the web client one injected global, `__DSH_TRANSPORT__ = { ownsHost:
    # true }`, so settings (model credentials above all) persist to the host on
    # any address, not only loopback pages. Without it the model-provider page
    # fails behind every named address with "settings are unavailable in this
    # browser". Same wait-not-inject shape as the row above.
    - id: ui-owns-host
      name: '@zhming0/dsh-yawn/owns-host'

    # The control plane mounts MCP servers once at the host root, so their
    # tools join the global registry and every agent inherits them. The
    # `minimal` preset is a complete-persona agent with a single persistent
    # shell, and the whole point of it is that tiny tool set; MCP schemas
    # would fill it back up. This row keeps the shared mounts and denies MCP
    # tools on the agents whose live preset is in the list, following the
    # agent-preset registry rather than the creation header, so a blank
    # session switched to `minimal` in the Web UI is covered too. It
    # recomputes the exact-name deny list whenever the registry changes.
    # Remove a preset id to let its sessions see MCP tools again. The row
    # also hides the servers a session turned off from the New Session row's
    # MCP menu, with their prompt sections; that needs no config.
    - id: mcp-tool-exclusion
      name: '@zhming0/dsh-yawn/mcp-tool-exclusion'
      config:
        excludedPresets: [minimal]

    # Native tools for managing other top-level sessions: list workspaces,
    # models, and sandbox profiles; create, message, wait for, and interrupt
    # the active turn.
    # create_session can optionally set a sandbox profile and model before the
    # first prompt; omitted settings use the deployment defaults. A child
    # reports its result back with send_message; the tools deliberately do not
    # return a transcript. They are registered per agent, not globally, so
    # subagents and excluded presets never see them; the calling agent comes
    # from the tool execution, so the model never passes a session id to
    # identify itself. Unlike the MCP rows above, these tools are only visible
    # inside dsh.
    - id: session-tools
      name: '@zhming0/dsh-yawn/session-tools'
      config:
        excludedPresets: [minimal]
