agents:
  queue: hosted-amd64-small

steps:
  - label: ":calendar: Calculate version"
    command: .buildkite/steps/set-calver

  - wait

  # One bake pushes both images. The control-plane image build stamps the release
  # version into the control plane and fails if the control plane's default runner tag
  # would not match, so the pair cannot drift.
  - label: ":docker: Build & Push control-plane and runner images"
    secrets:
      - GITHUB_TOKEN
    command: .buildkite/steps/build-and-push-image

  - wait

  # Stamps the chart's appVersion in the build checkout and pushes the chart.
  # It records the built commit in build meta-data for the release step.
  - label: ":helm: Package & push chart"
    secrets:
      - GITHUB_TOKEN
    command: .buildkite/steps/package-and-push-chart

  - wait

  # Creates the tag and the base release note at the commit the build started
  # from. The release skill prepends the highlight after this step.
  - label: ":github: Create GitHub release"
    secrets:
      - GITHUB_TOKEN
    command: .buildkite/steps/create-github-release
